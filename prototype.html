<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로스제로 시제품</title>
<style>
  :root{--ink:#1a1a1a;--sub:#6b6b6b;--line:#dcdcdc;--soft:#fafafa;--acc:#1f6f4a;--att:#b3541e;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:#eceff0;color:var(--ink);font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;}
  .wrap{display:flex;gap:24px;padding:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap;}

  /* 폰 */
  .phone{width:360px;height:800px;background:#fff;border:1px solid #c4c4c4;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 28px rgba(0,0,0,.13);flex:none;}
  .hd{height:48px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:14px;font-weight:700;}
  .hd .bk{font-weight:400;color:var(--sub);font-size:12px;cursor:pointer;}
  .bd{flex:1;overflow-y:auto;padding:16px;}
  .ft{flex:none;border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;}
  .ft>*{flex:1;}

  /* 부품 */
  .btn{border:1px solid var(--line);border-radius:6px;padding:13px 10px;text-align:center;font-size:13px;background:#fff;cursor:pointer;user-select:none;}
  .btn:active{background:#f2f2f2;}
  .btn.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700;}
  .btn.dis{background:#f1f1f1;color:#b0b0b0;border-color:#e4e4e4;cursor:default;}
  .btn.sm{padding:7px 10px;font-size:12px;}
  .card{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;background:#fff;}
  .card.soft{background:var(--soft);}
  .card.dash{border-style:dashed;}
  .t1{font-size:18px;font-weight:700;line-height:1.4;}
  .t2{font-size:15px;font-weight:700;}
  .sub{color:var(--sub);font-size:12px;line-height:1.6;}
  .mini{color:var(--sub);font-size:11px;}
  .num{font-size:28px;font-weight:700;letter-spacing:-1px;}
  .num.xl{font-size:44px;}
  .badge{display:inline-block;border:1px solid var(--line);border-radius:11px;padding:2px 9px;font-size:11px;color:var(--sub);}
  .badge.acc{background:var(--acc);color:#fff;border-color:var(--acc);}
  .badge.att{border-color:var(--att);color:var(--att);}
  .note{border:1px solid var(--line);border-left:3px solid var(--att);background:var(--soft);border-radius:6px;padding:10px 12px;font-size:12px;line-height:1.6;margin-bottom:12px;}
  .note.ok{border-left-color:var(--acc);}
  .row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid #eee;}
  .row .nm{flex:1;font-size:13px;}
  .kv{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;font-size:13px;border-bottom:1px solid #f0f0f0;}
  .kv:last-child{border-bottom:0;}
  .step{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:12px;}
  .step .i{color:var(--sub);width:14px;flex:none;}
  .step .l{flex:1;}
  .step .v{font-weight:700;}
  .stp{display:flex;align-items:center;gap:8px;}
  .stp b{min-width:34px;text-align:center;font-size:16px;}
  .pill{border:1px solid var(--line);border-radius:6px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;user-select:none;}
  .pill:active{background:#f0f0f0;}
  table.tb{width:100%;border-collapse:collapse;font-size:12px;}
  table.tb th{font-size:11px;color:var(--sub);font-weight:400;text-align:right;padding:6px 3px;border-bottom:1px solid var(--line);}
  table.tb th:first-child{text-align:left;}
  table.tb td{padding:8px 3px;border-bottom:1px solid #f0f0f0;text-align:right;}
  table.tb td:first-child{text-align:left;}
  .tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px;}
  .tabs div{flex:1;text-align:center;padding:9px;font-size:12px;cursor:pointer;border-right:1px solid var(--line);}
  .tabs div:last-child{border-right:0;}
  .tabs .on{background:var(--ink);color:#fff;font-weight:700;}
  .up{border:2px dashed var(--line);border-radius:10px;padding:26px 14px;text-align:center;cursor:pointer;}
  .up:active{background:#f7f7f7;}
  .pos{color:var(--acc);font-weight:700;}
  .neg{color:var(--att);font-weight:700;}
  .hr{height:1px;background:#eee;margin:14px 0;}
  .chip{display:inline-block;border:1px solid var(--line);border-radius:14px;padding:5px 11px;font-size:12px;margin:0 5px 5px 0;cursor:pointer;}
  .chip.on{background:var(--acc);color:#fff;border-color:var(--acc);}

  /* 사이드 */
  .side{width:320px;flex:none;}
  .side h1{font-size:19px;margin:0 0 4px;}
  .side .lead{font-size:12px;color:var(--sub);line-height:1.7;margin-bottom:16px;}
  .side h2{font-size:12px;margin:16px 0 7px;color:var(--sub);font-weight:700;letter-spacing:.4px;}
  .nav{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .nav a{display:block;padding:9px 13px;font-size:12px;border-bottom:1px solid #f0f0f0;cursor:pointer;color:var(--ink);text-decoration:none;}
  .nav a:last-child{border-bottom:0;}
  .nav a:hover{background:#f7f7f7;}
  .nav a.on{background:var(--ink);color:#fff;font-weight:700;}
  .nav .grp{padding:7px 13px;font-size:10px;color:var(--sub);background:#f7f7f7;border-bottom:1px solid #f0f0f0;letter-spacing:.4px;}
  .expl{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:12px;line-height:1.7;margin-top:14px;}
  .expl b{display:block;margin-bottom:5px;font-size:13px;}
  @media (max-width:760px){.wrap{padding:12px}.side{width:360px}}
</style>
</head>
<body>
<div class="wrap">

  <div class="phone">
    <div class="hd"><span id="hL" class="bk"></span><span id="hC"></span><span id="hR" class="badge"></span></div>
    <div class="bd" id="bd"></div>
    <div class="ft" id="ft"></div>
  </div>

  <div class="side">
    <h1>로스제로 시제품</h1>
    <div class="lead">
      실제로 눌러 보는 화면입니다. 숫자는 서로 연결되어 있어서, 버린 수량을 바꾸면 이익과 발주 추천이 같이 바뀝니다.<br>
      가정 — 테스트카페, 품목 6종, 오늘은 8월 30일(일) A베이커리·B유통 납품 요일.
    </div>
    <div class="nav" id="nav"></div>
    <div class="expl" id="expl"></div>
  </div>

</div>

<script>
/* ---------------- 데이터 ---------------- */
const 원 = n => n.toLocaleString('ko-KR') + '원';
const unitLabel = v => ({0:'없음', 0.25:'1/4통', 0.5:'반 통', 1:'1통'})[v] ?? v+'통';

// 품목 (A등급)
const items = {
  // 사 오는 것 — 매입가가 곧 원가
  krofl:  {name:'크로플',          kind:'사 옴', buy:1800, unit:6, sup:'A베이커리', stock:2, exp:2},
  cookie: {name:'초코쿠키',        kind:'사 옴', buy:900,  unit:1, sup:'A베이커리', stock:9, exp:5},

  // 직접 만드는 것 — 재료값 합계가 원가. batch = 한 판 재료, yield = 한 판에서 나오는 개수
  basque: {name:'바스크치즈케이크', kind:'직접 만듦', stock:1, exp:3,
           batch:{cheese:500, egg:4, cream:200}, yield:8, mins:70},

  // 원부자재
  milk:   {name:'우유 1L',      kind:'원부자재', buy:1900,  unit:12, sup:'B유통', stock:4, exp:4, per:1000, u:'ml'},
  cream:  {name:'생크림 500ml', kind:'원부자재', buy:4200,  unit:1,  sup:'B유통', stock:2, exp:1, per:500,  u:'ml'},
  berry:  {name:'딸기 1팩',     kind:'원부자재', buy:7000,  unit:1,  sup:'B유통', stock:1, exp:2, per:500,  u:'g'},
  cheese: {name:'크림치즈 1kg', kind:'원부자재', buy:12000, unit:1,  sup:'B유통', stock:1.2, exp:6, per:1000, u:'g'},
  egg:    {name:'계란 30구',    kind:'원부자재', buy:9000,  unit:1,  sup:'B유통', stock:0.8, exp:9, per:30,   u:'개'},
  // 발주 추천 대상은 아니지만(유통기한이 길다) 원가 계산에는 들어간다
  bean:   {name:'원두 1kg',     kind:'원부자재', buy:28000, unit:2,  sup:'C커피', stock:3, exp:60, per:1000, u:'g'},
};
// 부가세 면세 품목 — 가공하지 않은 농축수산물
const TAX_FREE = ['milk','egg','berry'];

// 매장 고정비 (월) — 인건비는 여기 없다. 시급으로 따로 계산한다
const FIXED = {
  rent:  {name:'임대료',        v:1800000},
  elec:  {name:'전기',          v:320000},
  water: {name:'수도',          v:55000},
  gas:   {name:'가스',          v:90000},
  comm:  {name:'통신·인터넷',    v:50000},
  etc:   {name:'소모품·기타',    v:180000},
};
// 인건비 — 시급 × 일한 시간 하나로만 계산한다 (이중 계산 방지)
const LABOR = { staffHours:8, ownerHours:10, wage:10500 };
const OPEN_DAYS = 26;             // 한 달 영업일
const CARD_FEE = 0.022;           // 카드 수수료율
const VAT = 0.1;                  // 부가세율
const SIMPLE_RATE = 0.15;         // 간이과세 음식점 업종별 부가가치율

// 오늘 POS 판매 (메뉴 → 수량)
const sales = [
  {menu:'크로플',        qty:16, price:3900, recipe:{krofl:1}},
  {menu:'바스크치즈케이크', qty:7,  price:6500, recipe:{basque:1}},   // 직접 구운 것을 조각으로 판다
  {menu:'초코쿠키',      qty:12, price:2500, recipe:{cookie:1}},
  {menu:'딸기라떼',      qty:42, price:6000, recipe:{milk:200, berry:40}},
  {menu:'크림라떼',      qty:18, price:6500, recipe:{milk:150, cream:50}},
  {menu:'아메리카노',    qty:63, price:4500, recipe:{bean:18}},
  {menu:'딸기크로플',    qty:9,  price:5500, recipe:null},          // ← 레시피 모름
];

// 상태
const S = {
  screen:'home',
  uploaded:false,
  recipeDone:false,
  newRecipe:{},
  waste:{krofl:0, basque:0, cookie:0},
  wasteUnit:{milk:0, cream:0, berry:0, cheese:0, egg:0},   // 0=없음 1=1통 .5=반통 .25=1/4
  baked:{basque:0},                        // 오늘 구운 판 수
  received:false,
  order:{krofl:12, cheese:1, milk:12, bean:2},
  confirmed:false,
  detail:'krofl',
  resTab:'ye',
  ownerPay:false,
  plMenu:'딸기라떼',
  taxType:'normal',      // normal | simple
  cardRatio:0.85,
  newPrice:0,            // 새 메뉴 판매가
};

/* ---------------- 계산 ---------------- */
// 직접 만드는 것의 한 개당 재료 원가 = 한 판 재료값 ÷ 나오는 개수
function costOf(k){
  const it = items[k];
  if(it.kind!=='직접 만듦') return it.buy;
  return Math.round(batchCost(k) / it.yield);
}
function batchCost(k){
  const it = items[k]; let sum=0;
  for(const m in it.batch) sum += items[m].buy * it.batch[m] / items[m].per;
  return Math.round(sum);
}
// 만드는 시간을 시급으로 환산한 값 — 참고용이다.
// 이 시간은 하루 인건비(시급 × 일한 시간)에 이미 들어 있으므로 손익에서 또 빼지 않는다.
function makeLabor(k){
  const it = items[k];
  if(it.kind!=='직접 만듦') return 0;
  return Math.round(LABOR.wage * it.mins/60 / it.yield);
}
function fullCost(k){ return costOf(k) + makeLabor(k); }   // 원가 화면 비교용

// 고정비 (인건비 제외)
function fixedMonth(){ let s=0; for(const k in FIXED) s+=FIXED[k].v; return s; }
const fixedDay = () => Math.round(fixedMonth()/OPEN_DAYS);

// 인건비 — 하루 일한 시간 × 시급. 만드는 시간도 이 안에 포함된다
function laborHours(){ return LABOR.staffHours + (S.ownerPay ? LABOR.ownerHours : 0); }
const laborDay = () => Math.round(laborHours() * LABOR.wage);

function consume(){                       // 오늘 소모량 (품목별)
  const c = {};
  for(const k in items) c[k]=0;
  // 판매로 나간 것
  sales.forEach(s=>{
    const r = s.recipe || (s.menu==='딸기크로플' && S.recipeDone ? S.newRecipe : null);
    if(!r) return;
    for(const k in r){
      if(items[k].kind==='원부자재') c[k]+=r[k]*s.qty/items[k].per;   // 용량 → 통 수
      else c[k]+=r[k]*s.qty;
    }
  });
  // 구우면서 나간 재료
  for(const k in S.baked){
    const n = S.baked[k]; if(!n) continue;
    for(const m in items[k].batch) c[m] += items[k].batch[m]*n/items[m].per;
  }
  return c;
}
function madeItems(){ return Object.keys(items).filter(k=>items[k].kind==='직접 만듦'); }
function unknownMenus(){
  return sales.filter(s=>!s.recipe && !s.skip && !(s.menu==='딸기크로플'&&S.recipeDone));
}
function wasteQty(k){
  return items[k].kind==='원부자재' ? S.wasteUnit[k] : S.waste[k];
}
function wasteMoney(){
  let t=0; for(const k in items) t += (wasteQty(k)||0)*costOf(k);
  return Math.round(t);
}
// 메뉴 한 개의 재료 원가. 인건비는 여기 넣지 않는다 (하루 인건비로 한 번만 뺀다)
function menuCost(s){
  const r = s.recipe || (s.menu==='딸기크로플'&&S.recipeDone?S.newRecipe:null);
  if(!r) return null;
  let mat=0, taxable=0;
  for(const k in r){
    const it=items[k];
    const c = it.kind==='원부자재' ? it.buy*r[k]/it.per : costOf(k)*r[k];
    mat += c;
    if(!TAX_FREE.includes(k)) taxable += c;
  }
  return {mat:Math.round(mat), taxable:Math.round(taxable)};
}

// 하루 손익
function pl(){
  let rev=0, mat=0, taxable=0, unknownRev=0, unknownQty=0;
  sales.forEach(s=>{
    rev += s.price*s.qty;
    const c = menuCost(s);
    if(!c){ unknownRev += s.price*s.qty; unknownQty += s.qty; return; }
    mat += c.mat*s.qty; taxable += c.taxable*s.qty;
  });
  const waste = wasteMoney();
  const card  = Math.round(rev * S.cardRatio * CARD_FEE);
  const fixed = fixedDay();
  const labor = laborDay();
  // 부가세 — 판매가는 부가세 포함으로 본다
  const vat = S.taxType==='simple'
    ? Math.round(rev * SIMPLE_RATE * VAT)                       // 간이: 매출 × 부가가치율 × 10%
    : Math.round(rev/11 - taxable/11);                          // 일반: 매출세액 − 매입세액(면세 제외)
  const net = rev - mat - labor - waste - card - fixed - vat;
  return {rev, mat, labor, waste, card, fixed, vat, net, taxable,
          rate: rev? net/rev*100 : 0,
          lossRate: rev? waste/rev*100 : 0,
          unknownRev, unknownQty};
}
function todayProfit(){ const p=pl(); return {rev:p.rev, cost:p.mat, waste:p.waste, skipRev:p.unknownRev}; }

// 품목별 폐기 금액을 그 품목을 쓰는 메뉴에 소모 비중으로 나눈다
function wasteAlloc(){
  const alloc = {}; sales.forEach(s=>alloc[s.menu]=0);
  for(const k in items){
    const w = (wasteQty(k)||0)*costOf(k); if(!w) continue;
    let tot=0; const use={};
    sales.forEach(s=>{
      const r = s.recipe || (s.menu==='딸기크로플'&&S.recipeDone?S.newRecipe:null);
      if(!r || !r[k]) return;
      const q = items[k].kind==='원부자재' ? r[k]*s.qty/items[k].per : r[k]*s.qty;
      use[s.menu]=q; tot+=q;
    });
    if(!tot) continue;
    for(const m in use) alloc[m] += w*use[m]/tot;
  }
  return alloc;
}

// 메뉴 하나의 손익 — 인건비·고정비·카드수수료·부가세·폐기까지 다 나눠 붙인다
function menuPL(s){
  const rev = s.price*s.qty;
  const c = menuCost(s);
  if(!c) return {rev, unknown:true};
  const P = pl();
  const share = P.rev ? rev/P.rev : 0;
  const mat   = c.mat*s.qty;
  const card  = Math.round(rev * S.cardRatio * CARD_FEE);
  const labor = Math.round(P.labor*share);          // 매출 비중으로 배부
  const fixed = Math.round(P.fixed*share);
  const vat   = Math.round(P.vat*share);
  const waste = Math.round(wasteAlloc()[s.menu]||0);
  const net   = rev - mat - labor - card - fixed - vat - waste;
  return {rev, mat, labor, card, fixed, vat, waste, net, rate: rev? net/rev*100 : 0};
}

/* ---------------- 화면 ---------------- */
const V = {};

V.home = () => {
  const u = unknownMenus().length;
  return {
    l:'', c:'8월 30일 (일)', r:'테스트카페',
    b:`
      <div class="t1">${S.confirmed?'오늘 할 일을 마쳤습니다':'오늘 매출을 올려 주세요'}</div>
      <div class="sub" style="margin:6px 0 16px">${S.confirmed?'발주 3건을 확정했습니다 · 주문 마감 15:00':'파일 하나 올리고, 버린 것만 적으면 끝납니다'}</div>

      ${S.confirmed?`
      <div class="card soft">
        <div class="kv"><span>오늘 버린 금액</span><b class="neg">${원(wasteMoney())}</b></div>
        <div class="kv"><span>오늘 남은 이익</span><b class="pos">${원(todayProfit().rev-todayProfit().cost-wasteMoney())}</b></div>
      </div>`:`
      <div class="card">
        <span class="badge acc">오늘은 발주하는 날</span>
        <div class="sub" style="margin-top:9px">A베이커리 · B유통 납품 요일입니다.<br>매출을 올리면 시킬 수량을 알려드립니다.</div>
      </div>`}

      ${u&&S.uploaded?`<div class="note">아직 모르는 메뉴가 ${u}개 있습니다. 알려 주시면 재료 계산이 정확해집니다.</div>`:''}

      <div class="hr"></div>
      <div class="mini" style="margin-bottom:7px">어제 결과</div>
      <div class="card">
        <div class="t2" style="margin-bottom:6px">어제 4,800원어치를 버렸습니다</div>
        <div class="sub">크로플 2개 · 생크림 1통</div>
        <div class="btn sm" style="margin-top:11px" data-go="res">어제 결과 보기</div>
      </div>

      <div class="card dash">
        <span class="badge att">주 1회</span>
        <div class="t2" style="margin:8px 0 4px">재고 맞추기</div>
        <div class="sub">앱이 계산한 재고가 맞는지 일요일에 한 번만 확인합니다.</div>
        <div class="btn sm" style="margin-top:11px" data-go="count">지금 확인하기</div>
      </div>
    `,

        <div class="kv"><span>차이 나는 품목</span><b>2종</b></div>
        <div class="kv"><span>차이 금액</span><b class="neg">−2,800원</b></div>
      </div>
      <div class="mini" style="margin-top:10px">시식·서비스로 나간 양입니다. 매주 크게 차이 나는 품목이 있으면 레시피를 다시 확인해 보세요.</div>
    `,
    f:`<div class="btn pri" data-go="home">맞습니다</div>`
  };
};

/* ---------------- 설명 ---------------- */
const EX = {
  home:['홈','매일 여기서 시작합니다. <b>할 일은 파일 올리기와 버린 것 적기 둘뿐</b>이고, 발주가 있는 날에만 추천이 붙습니다. 재고를 세라고 하지 않습니다.'],
  upload:['매출 찍기','포스 마감 화면을 <b>사진으로 찍기만</b> 하면 됩니다. 파일을 내려받아 올리는 건 매일 하기엔 귀찮습니다. 글자를 못 읽은 줄은 표시해서 확인만 받습니다.'],
  menupl:['메뉴별 뜯어보기','메뉴 하나가 <b>한 개 팔릴 때 실제로 얼마 남는지</b>입니다. 재료값·인건비·카드수수료·고정비 몫·부가세까지 다 뺐습니다. 위 칩으로 메뉴를 바꿔 보세요.'],
  recipe:['새 메뉴','메뉴를 미리 등록시키지 않습니다. 사진에서 잡힌 새 메뉴에 <b>판매가와 재료를 한 번만</b> 묻습니다. 많이 팔린 순서로 하루 1~2개씩이고, 넘겨도 됩니다. 재료를 고를 때마다 남는 돈이 바로 보입니다.'],
  bake:['오늘 구운 것','직접 만드는 품목만 나옵니다. <b>판 수만 적으면</b> 크림치즈·계란이 얼마나 나갔는지 앱이 계산합니다. 안 구운 날은 넘기면 됩니다.'],
  cost:['원가','사 오는 것은 매입가가 원가지만 <b>직접 만드는 것은 재료값 합계 ÷ 나오는 개수</b>입니다. 크림치즈 값이 오르면 여기서 바로 보입니다. 인건비·전기값은 안 넣습니다.'],
  waste:['버린 것 적기','매일 사장이 실제로 하는 유일한 입력입니다. 우유·생크림은 ml를 재지 않고 <b>통 단위 버튼</b>으로 받습니다. 금액이 바로 보입니다.'],
  recv:['받은 물건 확인','납품일에만 나옵니다. 발주 확정 수량이 기본값이라 <b>버튼 한 번</b>이면 끝납니다. 이 값이 있어야 재고 계산이 맞습니다.'],
  order:['오늘 할 일','<b>주방과 발주를 한 화면에 둡니다.</b> 굽는 카페의 진짜 고민은 "몇 개 시킬까"가 아니라 "몇 판 구울까"입니다. 구울 양이 정해져야 재료 발주량도 나옵니다.'],
  detail:['추천 상세','계산 과정을 사장의 말로 씁니다. 값이 안 바뀌는 단계는 아예 안 보여줍니다. 수량을 바꾸면 단위 안내가 뜨지만 <b>막지는 않습니다</b>.'],
  done:['확정 완료','거래처별로 묶습니다. 사장은 품목이 아니라 거래처 단위로 전화합니다. 실제 발주는 앱 밖에서 한다는 걸 분명히 적습니다.'],
  res:['결과 확인','<b>수익 탭</b>을 눌러 보세요. 매출에서 재료값·인건비·버린 것·카드수수료·고정비·부가세를 다 뺀 <b>진짜 남는 돈과 수익률</b>이 나옵니다. 버린 것을 바꾸면 이 숫자가 같이 움직입니다.'],
  fixed:['매장 설정','고정비·인건비·과세유형·카드비중을 한 번만 넣으면 매일 수익률에 반영됩니다. <b>사장님 시간을 넣고 보기</b>, <b>간이과세</b>를 눌러 보세요. 숫자가 크게 달라집니다.'],
  count:['재고 맞추기','매일이 아니라 <b>주 1회</b>입니다. 세는 게 아니라 앱이 계산한 값을 확인하는 것이고, 대부분 그대로 넘어갑니다.'],
};

/* ---------------- 렌더 ---------------- */
const NAV = [
  ['grp','매일'],
  ['home','홈'],['upload','매출 찍기 (사진)'],['recipe','재료 알려주기'],['bake','오늘 구운 것'],['waste','버린 것 적기'],['recv','받은 물건 확인'],
  ['grp','발주하는 날'],
  ['order','오늘 할 일 (구울 것 + 발주)'],['detail','추천 상세'],['done','확정 완료'],
  ['grp','보는 화면'],
  ['res','결과 확인 · 수익률'],['menupl','메뉴별 뜯어보기'],['cost','원가 (직접 만드는 것)'],['fixed','매장 설정'],['count','재고 맞추기 (주 1회)'],
];

function render(){
  const v = V[S.screen]();
  const hL=document.getElementById('hL');
  hL.textContent = v.l ? v.l.split('|')[0] : '';
  hL.dataset.go = v.l ? v.l.split('|')[1] : '';
  document.getElementById('hC').textContent = v.c;
  const hR=document.getElementById('hR'); hR.textContent=v.r||''; hR.style.display=v.r?'':'none';
  document.getElementById('bd').innerHTML = v.b;
  document.getElementById('ft').innerHTML = v.f || '';
  document.getElementById('ft').style.display = v.f ? '' : 'none';
  document.getElementById('bd').scrollTop = 0;

  document.getElementById('nav').innerHTML = NAV.map(([k,l])=>
    k==='grp' ? `<div class="grp">${l}</div>` : `<a data-go="${k}" class="${S.screen===k?'on':''}">${l}</a>`).join('');
  const e = EX[S.screen]||['',''];
  document.getElementById('expl').innerHTML = `<b>${e[0]}</b>${e[1]}`;
}

document.addEventListener('click', ev=>{
  const t = ev.target.closest('[data-go],[data-act]');
  if(!t) return;
  const act=t.dataset.act, go=t.dataset.go, k=t.dataset.k, v=t.dataset.v;

  if(act==='up'){ S.uploaded=true; }
  if(act==='chip'){ if(S.newRecipe[k]) delete S.newRecipe[k]; else S.newRecipe[k]=+v; }
  if(act==='price'){ S.newPrice = +v; }
  if(act==='saveRecipe'){
    S.recipeDone=true;
    const m = sales.find(s=>s.menu==='딸기크로플');
    if(m && S.newPrice) m.price = S.newPrice;
    S.screen='bake';
  }
  if(act==='b+'){ S.baked[k]++; }
  if(act==='b-'){ S.baked[k]=Math.max(0,S.baked[k]-1); }
  if(act==='w+'){ S.waste[k]++; }
  if(act==='w-'){ S.waste[k]=Math.max(0,S.waste[k]-1); }
  if(act==='wu'){ S.wasteUnit[k]=+v; }
  if(act==='recvOk'||act==='recvDiff'){ S.received=true; S.screen='order'; }
  if(act==='o+'){ S.order[S.detail]++; }
  if(act==='o-'){ S.order[S.detail]=Math.max(0,S.order[S.detail]-1); }
  if(act==='confirm'){ S.confirmed=true; S.screen='done'; }
  if(act==='tab'){ S.resTab=v; }
  if(act==='owner'){ S.ownerPay = v==='1'; }
  if(act==='plm'){ S.plMenu = v; }
  if(act==='tax'){ S.taxType = v; }
  if(act==='card'){ S.cardRatio = +v; }
  if(act==='reshoot'){ S.uploaded=false; }

  if(go){ if(k) S.detail=k; S.screen=go; }
  render();
});

render();
</script>
</body>
</html>
