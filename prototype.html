<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로스제로 시제품</title>
<style>
  :root{--ink:#1a1a1a;--sub:#6b6b6b;--line:#dcdcdc;--soft:#fafafa;--acc:#1f6f4a;--att:#b3541e;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:#eceff0;color:var(--ink);font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;}
  .wrap{display:flex;gap:24px;padding:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap;}
  .phone{width:360px;height:800px;background:#fff;border:1px solid #c4c4c4;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 28px rgba(0,0,0,.13);flex:none;position:relative;}
  .hd{height:48px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:14px;font-weight:700;}
  .hd .bk{font-weight:400;color:var(--sub);font-size:12px;cursor:pointer;}
  .bd{flex:1;overflow-y:auto;padding:16px;}
  .ft{flex:none;border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;}
  .ft>*{flex:1;}
  .btn{border:1px solid var(--line);border-radius:6px;padding:13px 10px;text-align:center;font-size:13px;background:#fff;cursor:pointer;user-select:none;}
  .btn:active{background:#f2f2f2;}
  .btn.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700;}
  .btn.dis{background:#f1f1f1;color:#b0b0b0;border-color:#e4e4e4;cursor:default;}
  .btn.sm{padding:7px 10px;font-size:12px;}
  .card{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;background:#fff;}
  .card.soft{background:var(--soft);}
  .card.dash{border-style:dashed;}
  .card.tap{cursor:pointer;}
  .card.tap:active{background:#f7f7f7;}
  .t1{font-size:18px;font-weight:700;line-height:1.4;}
  .t2{font-size:15px;font-weight:700;}
  .sub{color:var(--sub);font-size:12px;line-height:1.6;}
  .mini{color:var(--sub);font-size:11px;}
  .num{font-size:28px;font-weight:700;letter-spacing:-1px;}
  .num.xl{font-size:44px;}
  .badge{display:inline-block;border:1px solid var(--line);border-radius:11px;padding:2px 9px;font-size:11px;color:var(--sub);}
  .badge.acc{background:var(--acc);color:#fff;border-color:var(--acc);}
  .badge.att{border-color:var(--att);color:var(--att);}
  .note{border:1px solid var(--line);border-left:3px solid var(--att);background:var(--soft);border-radius:6px;padding:10px 12px;font-size:12px;line-height:1.6;margin-bottom:12px;}
  .note.ok{border-left-color:var(--acc);}
  .row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid #eee;}
  .row .nm{flex:1;font-size:13px;}
  .kv{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;font-size:13px;border-bottom:1px solid #f0f0f0;}
  .kv:last-child{border-bottom:0;}
  .step{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid #f0f0f0;font-size:12px;}
  .step .i{color:var(--sub);width:14px;flex:none;}
  .step .l{flex:1;}
  .step .v{font-weight:700;}
  .stp{display:flex;align-items:center;gap:8px;}
  .stp b{min-width:34px;text-align:center;font-size:16px;}
  .pill{border:1px solid var(--line);border-radius:6px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;user-select:none;}
  .pill:active{background:#f0f0f0;}
  .pill.sm{width:28px;height:28px;font-size:14px;}
  table.tb{width:100%;border-collapse:collapse;font-size:12px;}
  table.tb th{font-size:11px;color:var(--sub);font-weight:400;text-align:right;padding:6px 3px;border-bottom:1px solid var(--line);}
  table.tb th:first-child{text-align:left;}
  table.tb td{padding:8px 3px;border-bottom:1px solid #f0f0f0;text-align:right;}
  table.tb td:first-child{text-align:left;}
  .tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px;}
  .tabs div{flex:1;text-align:center;padding:9px;font-size:12px;cursor:pointer;border-right:1px solid var(--line);}
  .tabs div:last-child{border-right:0;}
  .tabs .on{background:var(--ink);color:#fff;font-weight:700;}
  .up{border:2px dashed var(--line);border-radius:10px;padding:26px 14px;text-align:center;cursor:pointer;}
  .up:active{background:#f7f7f7;}
  .pos{color:var(--acc);font-weight:700;}
  .neg{color:var(--att);font-weight:700;}
  .hr{height:1px;background:#eee;margin:14px 0;}
  .chip{display:inline-block;border:1px solid var(--line);border-radius:14px;padding:5px 11px;font-size:12px;margin:0 5px 5px 0;cursor:pointer;}
  .chip.on{background:var(--acc);color:#fff;border-color:var(--acc);}
  .grp{border:1px solid var(--line);border-radius:10px;padding:12px 12px 6px;margin-bottom:10px;}
  .grp>.gh{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;border-bottom:1px solid #eee;}
  .toast{position:absolute;left:16px;right:16px;bottom:78px;background:rgba(26,26,26,.94);color:#fff;font-size:12px;padding:11px 14px;border-radius:8px;opacity:0;transition:opacity .18s;pointer-events:none;line-height:1.5;}
  .toast.on{opacity:1;}
  .side{width:340px;flex:none;}
  .side h1{font-size:19px;margin:0 0 4px;}
  .side .lead{font-size:12px;color:var(--sub);line-height:1.7;margin-bottom:16px;}
  .nav{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .nav a{display:block;padding:9px 13px;font-size:12px;border-bottom:1px solid #f0f0f0;cursor:pointer;color:var(--ink);text-decoration:none;}
  .nav a:last-child{border-bottom:0;}
  .nav a:hover{background:#f7f7f7;}
  .nav a.on{background:var(--ink);color:#fff;font-weight:700;}
  .nav .ghd{padding:7px 13px;font-size:10px;color:var(--sub);background:#f7f7f7;border-bottom:1px solid #f0f0f0;letter-spacing:.4px;}
  .expl{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:12px;line-height:1.7;margin-top:14px;}
  .expl b{display:block;margin-bottom:5px;font-size:13px;}
  .reset{margin-top:10px;text-align:center;font-size:11px;color:var(--sub);cursor:pointer;text-decoration:underline;}
  @media (max-width:760px){.wrap{padding:12px}.side{width:360px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="phone">
    <div class="hd"><span id="hL" class="bk"></span><span id="hC"></span><span id="hR" class="badge"></span></div>
    <div class="bd" id="bd"></div>
    <div class="ft" id="ft"></div>
    <div class="toast" id="toast"></div>
  </div>
  <div class="side">
    <h1>로스제로 시제품</h1>
    <div class="lead">
      재료와 사는 단위를 나눠서 다룹니다. 우유는 1L·2.3L 두 가지를 같이 쓰고,
      레시피는 ml로 세고, 발주와 재고는 통으로 셉니다.<br>
      기록은 8월 23~29일 7일치, 오늘은 8월 30일(일)입니다.
    </div>
    <div class="nav" id="nav"></div>
    <div class="expl" id="expl"></div>
    <div class="reset" id="reset">오늘 입력 초기화</div>
  </div>
</div>

<script>
/* ══════════════ 공통 ══════════════ */
const 원 = n => Math.round(n).toLocaleString('ko-KR') + '원';
const DOW = ['일','월','화','수','목','금','토'];
const dow = d => new Date(d+'T00:00:00').getDay();
const md  = d => `${+d.slice(5,7)}월 ${+d.slice(8,10)}일`;
const addDays = (d,n)=>{const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;};
// 받침 따라 조사 붙이기
function josa(w,pair){const [a,b]=pair.split('/');const c=String(w).charCodeAt(String(w).length-1);
  if(c<0xAC00||c>0xD7A3) return w+b; return w+(((c-0xAC00)%28)?a:b);}

const TODAY='2026-08-30';
const HIST=[0,1,2,3,4,5,6].map(i=>addDays(TODAY,i-7));

const SUP={ 'A베이커리':{days:[0,2,4,6],deadline:'15:00'},
            'B유통':{days:[0,4],deadline:'16:00'},
            'C커피':{days:[0],deadline:'17:00'} };

/* ══════════════ 재료 · 사는 단위 ══════════════
   재료(mats)  — 레시피가 세는 것. 우유는 ml, 계란은 개
   사는 단위(skus) — 발주·재고·폐기를 세는 것. 우유 1L 통, 우유 2.3L 통
   같은 재료를 여러 크기로 살 수 있다.                             */
const mats = {
  krofl:  {name:'크로플',           u:'개',   shelf:2,  kind:'사 옴'},
  cookie: {name:'초코쿠키',         u:'개',   shelf:5,  kind:'사 옴'},
  basque: {name:'바스크치즈케이크', u:'조각', shelf:3,  kind:'직접 만듦',
           batch:{cheese:500, egg:4, cream:200}, yield:8, mins:70},
  milk:   {name:'우유',    u:'ml', shelf:4,  kind:'원부자재', taxFree:true},
  cream:  {name:'생크림',  u:'ml', shelf:1,  kind:'원부자재'},
  berry:  {name:'딸기',    u:'g',  shelf:2,  kind:'원부자재', taxFree:true},
  cheese: {name:'크림치즈',u:'g',  shelf:6,  kind:'원부자재'},
  egg:    {name:'계란',    u:'개', shelf:9,  kind:'원부자재', taxFree:true},
  bean:   {name:'원두',    u:'g',  shelf:60, kind:'원부자재'},
};
const skus = {
  krofl:   {mat:'krofl',  name:'크로플',       size:1,    buy:1800,  cu:'개',   unit:6,  box:'박스', sup:'A베이커리', main:true},
  cookie:  {mat:'cookie', name:'초코쿠키',     size:1,    buy:900,   cu:'개',   unit:1,             sup:'A베이커리', main:true},
  milk1:   {mat:'milk',   name:'우유 1L',      size:1000, buy:1900,  cu:'통',   unit:12, box:'박스', sup:'B유통',    main:true},
  milk23:  {mat:'milk',   name:'우유 2.3L',    size:2300, buy:4100,  cu:'통',   unit:6,  box:'박스', sup:'B유통'},
  cream5:  {mat:'cream',  name:'생크림 500ml', size:500,  buy:4200,  cu:'통',   unit:1,             sup:'B유통',    main:true},
  cream10: {mat:'cream',  name:'생크림 1L',    size:1000, buy:7800,  cu:'통',   unit:1,             sup:'B유통'},
  berry:   {mat:'berry',  name:'딸기 500g',    size:500,  buy:7000,  cu:'팩',   unit:1,             sup:'B유통',    main:true},
  // showBase = 통·개로 세지 않고 재료 단위(g)로 표시한다. ± 는 여전히 1kg 블록씩 움직인다
  cheese:  {mat:'cheese', name:'크림치즈',     size:1000, buy:12000, cu:'g',    unit:1, showBase:true, sup:'B유통', main:true},
  egg:     {mat:'egg',    name:'계란 30구',    size:30,   buy:9000,  cu:'판',   unit:1,             sup:'B유통',    main:true},
  bean:    {mat:'bean',   name:'원두 2kg',     size:2000, buy:56000, cu:'봉지', unit:1,             sup:'C커피',    main:true},
};
// 초기화로 되돌릴 수 있게 원본을 남긴다
const MAT_SEED=JSON.parse(JSON.stringify(mats)), SKU_SEED=JSON.parse(JSON.stringify(skus));
function resetItems(){
  for(const k in mats) delete mats[k];
  Object.assign(mats, JSON.parse(JSON.stringify(MAT_SEED)));
  for(const k in skus) delete skus[k];
  Object.assign(skus, JSON.parse(JSON.stringify(SKU_SEED)));
}
const skusOf  = m => Object.keys(skus).filter(s=>skus[s].mat===m);
const mainSku = m => skusOf(m).find(s=>skus[s].main) || skusOf(m)[0];
// 직접 만드는 것으로 치려면 한 판 재료와 나오는 개수가 있어야 한다
const isMade   = m => mats[m].kind==='직접 만듦' && mats[m].batch && Object.keys(mats[m].batch).length && mats[m].yield>0;
const orderMats = () => Object.keys(mats).filter(m=>!isMade(m) && skusOf(m).length);
const madeMats  = () => Object.keys(mats).filter(isMade);
// 재료 1단위(ml·g·개) 값 — 주력 사는 단위 기준
const unitPrice = m => { const s=skus[mainSku(m)]; return s.buy/s.size; };
// 사는 단위 수량을 화면에 쓰는 말로 — showBase 면 g·ml로 편다
const qtyText=(s,q)=>{const sk=skus[s];
  return sk.showBase ? `${Math.round(q*sk.size)}${mats[sk.mat].u}` : `${q}${sk.cu}`;};
// 재료 보기 좋게 — 4900 → 4.9L
function fmt(m,q){
  const u=mats[m].u;
  if(u==='ml'||u==='g'){ const big=u==='ml'?'L':'kg';
    return q>=1000 ? (q/1000).toFixed(Math.round(q)%1000?1:0)+big : Math.round(q)+u; }
  return (Math.abs(q%1)>0.001?q.toFixed(1):Math.round(q))+u;
}

const MENU_SEED = {
  krofl:  {name:'크로플',          price:3900, recipe:{krofl:1}},
  basque: {name:'바스크치즈케이크', price:6500, recipe:{basque:1}},
  cookie: {name:'초코쿠키',        price:2500, recipe:{cookie:1}},
  slatte: {name:'딸기라떼',        price:6000, recipe:{milk:200, berry:40}},
  clatte: {name:'크림라떼',        price:6500, recipe:{milk:150, cream:50}},
  ame:    {name:'아메리카노',      price:4500, recipe:{bean:18}},
  skrofl: {name:'딸기크로플',      price:null, recipe:null},
};
const cloneMenus = () => JSON.parse(JSON.stringify(MENU_SEED));
let menus = cloneMenus();

/* 7일 기록 — 폐기·입고는 사는 단위(sku) 기준 */
const SEED=[
  {sales:[15,8,12,40,18,60,9], waste:{krofl:2, cream5:0.5}, baked:{basque:2}},
  {sales:[10,6, 9,30,13,52,6], waste:{}},
  {sales:[11,6,10,32,14,55,7], waste:{cookie:1}, baked:{basque:1}},
  {sales:[ 9,5, 9,28,12,50,6], waste:{}, soldOut:['krofl']},
  {sales:[11,6,10,33,15,56,7], waste:{milk1:0.25}, baked:{basque:2}},
  {sales:[13,7,11,38,17,62,8], waste:{krofl:1}},
  {sales:[17,9,14,45,20,68,10], waste:{krofl:2, cream5:0.5}, baked:{basque:2}},
];
const MK=['krofl','basque','cookie','slatte','clatte','ame','skrofl'];
const history={};
HIST.forEach((d,i)=>{const s={};MK.forEach((k,j)=>s[k]=SEED[i].sales[j]);
  history[d]={sales:s, waste:SEED[i].waste||{}, baked:SEED[i].baked||{}, soldOut:SEED[i].soldOut||[], received:{}};});
history[HIST[6]].suggested={krofl:24, cookie:12, milk1:12};   // 어제 확정한 발주 (사는 단위)

// 지난 일요일 실사 — 재료 단위
const lastCount={date:HIST[6], qty:{krofl:2, basque:8, cookie:9, milk:4000, cream:1000, berry:2000, cheese:1200, egg:24, bean:3000}};

const FIXED={rent:1800000, elec:320000, water:55000, gas:90000, comm:50000, etc:180000};
const FIXED_NAME={rent:'임대료', elec:'전기', water:'수도', gas:'가스', comm:'통신·인터넷', etc:'소모품·기타'};
const CARD_FEE=0.022, VAT=0.1, SIMPLE_RATE=0.15;

/* ══════════════ 상태 ══════════════ */
const blank=()=>({
  screen:'home', uploaded:false, confirmed:false, recvEdit:false,
  todaySales:{krofl:16, basque:7, cookie:12, slatte:42, clatte:18, ame:63, skrofl:9},
  todayWaste:{}, todayBaked:{basque:0}, todayRecv:{},
  newPrice:0, newRecipe:{},
  order:{}, orderTouched:{}, orderSku:{}, supFilter:null,
  detail:'krofl', resTab:'ye', plMenu:'slatte', editMenu:'krofl', editItem:'krofl',
  fixed:{...FIXED}, wage:10500, staffHours:8, ownerHours:10, openDays:26,
  ownerPay:false, taxType:'normal', cardRatio:0.85,
  count:{}, stockAdj:{}, ocrCheck:['clatte'],
});
let S=blank();

/* ══════════════ 계산 ══════════════ */
const recipeOf=k=>(k==='skrofl'&&Object.keys(S.newRecipe).length)?S.newRecipe:menus[k].recipe;
const priceOf =k=>(k==='skrofl'&&S.newPrice)?S.newPrice:menus[k].price;
const skuFor  =m=>S.orderSku[m]||mainSku(m);

function batchCost(m){let s=0;for(const x in (mats[m].batch||{}))s+=unitPrice(x)*mats[m].batch[x];return Math.round(s);}
const costOf=m=>isMade(m)?Math.round(batchCost(m)/mats[m].yield):(skusOf(m).length?unitPrice(m):0);
const makeLabor=m=>isMade(m)?Math.round(S.wage*(mats[m].mins||0)/60/mats[m].yield):0;
const fullCost=m=>costOf(m)+makeLabor(m);

function menuCost(k){
  const r=recipeOf(k); if(!r) return null;
  let mat=0,taxable=0;
  for(const m in r){ const c=costOf(m)*r[m]; mat+=c; if(!mats[m].taxFree) taxable+=c; }
  return {mat:Math.round(mat), taxable:Math.round(taxable)};
}
// 사는 단위 기록 → 재료 단위로
const toBase=obj=>{const o={};for(const s in obj){const k=skus[s].mat;o[k]=(o[k]||0)+obj[s]*skus[s].size;}return o;};
const wasteBase=day=>toBase(day===TODAY?S.todayWaste:(history[day].waste||{}));
function recvBase(day){
  if(day!==TODAY) return toBase(history[day].received||{});
  return toBase({...(history[HIST[6]].suggested||{}), ...S.todayRecv});
}
const bakedOf=day=>day===TODAY?S.todayBaked:(history[day].baked||{});

function consume(day){
  const rec=day===TODAY?{sales:S.todaySales, baked:S.todayBaked}:history[day];
  const c={}; for(const m in mats) c[m]=0;
  for(const mk in (rec.sales||{})){
    const r=day===TODAY?recipeOf(mk):menus[mk].recipe; if(!r) continue;
    const q=rec.sales[mk]||0;
    for(const m in r) c[m]+=r[m]*q;
  }
  for(const bk in (rec.baked||{})){
    const n=rec.baked[bk]||0; if(!n) continue;
    for(const x in mats[bk].batch) c[x]+=mats[bk].batch[x]*n;
  }
  return c;
}
function stockNow(m){
  let q=(lastCount.qty[m]??0)+(S.stockAdj[m]||0);
  q+=(recvBase(TODAY)[m]||0);
  if(isMade(m)) q+=(bakedOf(TODAY)[m]||0)*mats[m].yield;
  q-=consume(TODAY)[m]||0;
  q-=(wasteBase(TODAY)[m]||0);
  return q;
}
function avg7(m){let s=0,n=0;
  for(const d of HIST){ if((history[d].soldOut||[]).includes(m)) continue; s+=consume(d)[m]||0; n++; }
  return n?s/n:0;}
function dowFactor(m,w){
  const base=avg7(m); if(!base) return 1;
  const d=HIST.find(x=>dow(x)===w); if(!d||(history[d].soldOut||[]).includes(m)) return 1;
  return Math.max(0.5,Math.min(1.6,(consume(d)[m]||0)/base));
}
function coverDays(sup){const days=SUP[sup].days,out=[];
  for(let i=1;i<=8;i++){const d=addDays(TODAY,i);out.push(d);if(days.includes(dow(d)))break;}return out;}

function orderSuggest(m){
  const sk=skus[skuFor(m)], cover=coverDays(sk.sup);
  const base=avg7(m), stock=stockNow(m), steps=[];
  steps.push(['7일 평균 나간 양', fmt(m,base)]);
  const so=HIST.filter(d=>(history[d].soldOut||[]).includes(m)).length;
  if(so) steps.push([`품절난 ${so}일은 빼고 계산`, fmt(m,base)]);
  let need=0; cover.forEach(d=>need+=base*dowFactor(m,dow(d)));
  steps.push([`다음 납품까지 ${cover.length}일치 (${cover.map(d=>DOW[dow(d)]).join('·')})`, '='+fmt(m,need)]);
  steps.push(['지금 남은 것 빼기', '−'+fmt(m,stock)]);
  let short=Math.max(0,need-stock);
  const raw=short/sk.size;
  const cl=sk.showBase?'덩이':sk.cu;                    // g으로 세는 품목은 "덩이"로 말한다
  steps.push([`한 ${cl}에 ${fmt(m,sk.size)}`, raw.toFixed(1)+cl]);
  let qty=Math.ceil(raw/sk.unit)*sk.unit;
  if(sk.unit>1) steps.push([`${sk.unit}${cl}들이 ${sk.box}로 맞추기`, qty+cl]);
  return {qty, raw, stock, base, cover, steps, sku:skuFor(m), cu:sk.cu};
}
function bakeSuggest(m){
  const it=mats[m], base=avg7(m), stock=stockNow(m), tm=addDays(TODAY,1);
  const need=base*dowFactor(m,dow(tm));
  const batches=Math.ceil(Math.max(0,need-stock)/it.yield);
  const matsNeed={}; for(const x in it.batch) matsNeed[x]=it.batch[x]*batches;
  return {batches, need, stock, mats:matsNeed, yieldQty:batches*it.yield,
    steps:[['7일 평균 나간 양',fmt(m,base)],[`내일(${DOW[dow(tm)]}) 요일 보정`,fmt(m,need)],
           ['지금 남은 것 빼기','−'+fmt(m,stock)],[`한 판 ${josa(it.yield+it.u,'으로/로')} 나누기`,batches+'판']]};
}
function orderList(){
  const extra={};
  madeMats().forEach(m=>{const b=bakeSuggest(m);for(const x in b.mats)extra[x]=(extra[x]||0)+b.mats[x];});
  const out=[];
  for(const m of orderMats()){
    const sk=skus[skuFor(m)];
    if(!SUP[sk.sup].days.includes(dow(TODAY))) continue;
    const s=orderSuggest(m);
    let qty=s.qty, note=null;
    if(extra[m]){
      const w=Math.ceil((s.raw+extra[m]/sk.size)/sk.unit)*sk.unit;
      if(w>qty){ note=`내일 구울 몫 ${fmt(m,extra[m])} 포함`; qty=w; }
    }
    if(qty<=0) continue;
    out.push({m, qty, sug:s, note, sku:skuFor(m)});
  }
  return out;
}

function wasteMoney(){let t=0;const b=wasteBase(TODAY);for(const m in b)t+=b[m]*costOf(m);return Math.round(t);}
const fixedMonth=()=>Object.values(S.fixed).reduce((a,b)=>a+b,0);
const fixedDay=()=>Math.round(fixedMonth()/S.openDays);
const laborHours=()=>S.staffHours+(S.ownerPay?S.ownerHours:0);
const laborDay=()=>Math.round(laborHours()*S.wage);

function pl(){
  let rev=0,mat=0,taxable=0,unknownRev=0,unknownQty=0;
  for(const k in S.todaySales){
    const q=S.todaySales[k]||0,p=priceOf(k),c=menuCost(k);
    if(!p||!c){ if(p)unknownRev+=p*q; unknownQty+=q; continue; }
    rev+=p*q; mat+=c.mat*q; taxable+=c.taxable*q;
  }
  const waste=wasteMoney(), card=Math.round(rev*S.cardRatio*CARD_FEE);
  const fixed=fixedDay(), labor=laborDay();
  const vat=S.taxType==='simple'?Math.round(rev*SIMPLE_RATE*VAT):Math.round(rev/11-taxable/11);
  const net=rev-mat-labor-waste-card-fixed-vat;
  return {rev,mat,labor,waste,card,fixed,vat,net,
    rate:rev?net/rev*100:0, lossRate:rev?waste/rev*100:0, unknownRev, unknownQty};
}
function wasteAlloc(){
  const a={}; for(const k in menus)a[k]=0;
  const b=wasteBase(TODAY);
  for(const m in b){
    const w=b[m]*costOf(m); if(!w) continue;
    let tot=0; const use={};
    for(const mk in S.todaySales){const r=recipeOf(mk); if(!r||!r[m])continue;
      const q=r[m]*S.todaySales[mk]; use[mk]=q; tot+=q;}
    if(!tot) continue;
    for(const mk in use) a[mk]+=w*use[mk]/tot;
  }
  return a;
}
function menuPL(k){
  const q=S.todaySales[k]||0,p=priceOf(k),c=menuCost(k),rev=(p||0)*q;
  if(!p||!c) return {rev,qty:q,unknown:true};
  const P=pl(),share=P.rev?rev/P.rev:0;
  const mat=c.mat*q, card=Math.round(rev*S.cardRatio*CARD_FEE);
  const labor=Math.round(P.labor*share), fixed=Math.round(P.fixed*share), vat=Math.round(P.vat*share);
  const waste=Math.round(wasteAlloc()[k]||0);
  const net=rev-mat-labor-card-fixed-vat-waste;
  return {rev,qty:q,mat,labor,card,fixed,vat,waste,net,rate:rev?net/rev*100:0};
}
function yesterday(){
  const y=HIST[6],c=consume(y),sug=history[y].suggested||{},rows=[];
  const sugByMat={}; for(const s in sug) sugByMat[skus[s].mat]=`${sug[s]}${skus[s].cu}`;
  const wb=toBase(history[y].waste||{});
  for(const m in mats){ if(!(c[m]>0)&&!sugByMat[m]) continue;
    rows.push({m, sug:sugByMat[m]??null, used:c[m]||0, left:lastCount.qty[m]??0,
               waste:wb[m]||0, soldOut:(history[y].soldOut||[]).includes(m)}); }
  return {date:y, rows};
}
function weekWaste(){
  let cur=0,rev=0; const byMat={};
  HIST.forEach(d=>{ const b=toBase(history[d].waste||{});
    for(const m in b){cur+=b[m]*costOf(m); byMat[m]=(byMat[m]||0)+b[m];}
    for(const mk in history[d].sales){const p=menus[mk].price; if(p)rev+=p*history[d].sales[mk];} });
  return {cur:Math.round(cur), prev:Math.round(cur*1.52), rate:rev?cur/rev*100:0, byMat,
          soldOutDays:HIST.filter(d=>(history[d].soldOut||[]).length).length};
}

                <span class="pill sm" data-act="isz+" data-k="${s}">+</span></span></div>
            <div class="row" style="border:0;padding:6px 2px"><span class="nm">한 ${cl} 값</span>

/* 메뉴 하나 고치기 — 판매가와 재료 수량 */
V.menuEdit=()=>{
  const k=S.editMenu||'krofl', mn=menus[k];
  const r=recipeOf(k)||{};
  const price=priceOf(k)||0;
  const cost=Object.keys(r).reduce((a,m)=>a+costOf(m)*r[m],0);
  const step=m=>(mats[m].u==='ml'||mats[m].u==='g')?10:1;
  const rest=Object.keys(mats).filter(m=>!(m in r));
  return {l:'← 목록|recipe', c:mn.name, r:'고치기',
    b:`<div class="card"><div class="mini" style="margin-bottom:8px">판매가 (± 500원)</div>
        <div style="display:flex;gap:10px;align-items:center">
          <div class="pill" data-act="mp-">−</div>
          <div style="flex:1;text-align:center;border:1px solid var(--line);border-radius:6px;padding:11px;font-size:17px;font-weight:700">${price?price.toLocaleString()+'원':'모름'}</div>
          <div class="pill" data-act="mp+">+</div></div></div>

      <div class="mini" style="margin:14px 0 6px">한 개에 들어가는 재료</div>
      ${Object.keys(r).length?Object.keys(r).map(m=>`
        <div class="row"><span class="nm">${mats[m].name}
            <div class="mini">${원(costOf(m)*r[m])} · ${fmt(m,1)}당 ${Math.round(costOf(m)*100)/100}원</div></span>
          <span class="stp"><span class="pill sm" data-act="ma-" data-k="${m}">−</span>
            <b style="min-width:52px;font-size:13px">${r[m]}${mats[m].u}</b>
            <span class="pill sm" data-act="ma+" data-k="${m}">+</span>
            <span class="chip" style="margin:0 0 0 6px;padding:3px 9px" data-act="mdel" data-k="${m}">빼기</span></span></div>`).join('')
        :'<div class="card dash"><div class="sub">아직 재료를 안 넣으셨습니다. 아래에서 고르세요.</div></div>'}

      ${rest.length?`<div class="mini" style="margin:14px 0 6px">재료 넣기 (${step('milk')===10?'ml·g는 10씩':''})</div>
        ${rest.map(m=>`<span class="chip" data-act="madd" data-k="${m}">+ ${mats[m].name}</span>`).join('')}`:''}

      <div class="card soft" style="margin-top:14px">
        <div class="kv"><span>판매가</span><b>${price?원(price):'—'}</b></div>
        <div class="kv"><span>재료값</span><b>${Object.keys(r).length?'−'+원(cost):'—'}</b></div>
        <div class="kv"><span>재료 빼고 남는 것</span><b class="${price-cost>=0?'pos':'neg'}">${price&&Object.keys(r).length?원(price-cost):'—'}</b></div>
        ${price&&Object.keys(r).length?`<div class="kv"><span>재료값 비중</span><b>${(cost/price*100).toFixed(1)}%</b></div>`:''}
      </div>
      <div class="note">고친 값은 <b>오늘부터</b> 적용됩니다. 지난 기록은 그대로 둡니다.</div>`,
    f:`<div class="btn" data-go="recipe">목록으로</div>`};
};

V.bake=()=>{
  // 아직 사 오는 걸로 돼 있는 품목 — 여기서 바로 굽는 걸로 바꿀 수 있다
  const bought=Object.keys(mats).filter(m=>mats[m].kind==='사 옴');
  const half=Object.keys(mats).filter(m=>mats[m].kind==='직접 만듦'&&!isMade(m));
  return {l:'← 매출|upload', c:'오늘 구운 것', r:'',
  b:`<div class="sub" style="margin-bottom:12px">오늘 몇 판 구우셨나요? 안 구운 날은 그냥 넘기시면 됩니다.</div>
    ${madeMats().map(m=>{const it=mats[m],n=S.todayBaked[m]||0;
      return `<div class="card"><div style="display:flex;align-items:flex-start">
        <div style="flex:1"><b style="font-size:14px">${it.name}</b>
          <div class="mini" style="margin-top:3px">1판 = ${it.yield}${it.u} · ${it.mins}분</div></div>
        <span class="stp"><span class="pill" data-act="b-" data-k="${m}">−</span><b>${n}</b>
          <span class="pill" data-act="b+" data-k="${m}">+</span></span></div>
        <div class="mini" style="margin-top:9px;padding-top:9px;border-top:1px solid #eee">한 판에 ${Object.keys(it.batch).map(x=>`${mats[x].name} ${it.batch[x]}${mats[x].u}`).join(' · ')}</div>
        ${n?`<div class="kv" style="margin-top:6px"><span>나온 ${it.u}</span><b>${n*it.yield}${it.u}</b></div>
             <div class="kv"><span>들어간 재료값</span><b>${원(batchCost(m)*n)}</b></div>
             <div class="kv"><span>한 ${it.u} 원가</span><b>${원(costOf(m))}</b></div>`:''}</div>`;}).join('')}
    ${madeMats().length?`<div class="note ok">판 수만 적으면 <b>재료가 얼마나 나갔는지</b> 앱이 계산합니다.</div>
      <div class="btn sm" data-go="cost">한 조각 원가가 어떻게 나오는지 보기</div>`:''}

    ${half.length?`<div class="note"><b>${half.map(m=>mats[m].name).join(' · ')}</b>는 굽는 걸로 해두셨는데
      한 판에 뭐가 들어가는지 아직 안 알려주셨습니다.
      ${half.map(m=>`<div class="btn sm" style="margin-top:8px" data-go="itemEdit" data-k="${m}">${mats[m].name} 재료 넣기</div>`).join('')}</div>`:''}

    <div class="hr"></div>
    <div class="mini" style="margin-bottom:7px">이것도 직접 구우시나요?</div>
    <div class="sub" style="margin-bottom:8px">지금은 사 오는 걸로 돼 있습니다. 누르면 굽는 걸로 바꿉니다.</div>
    ${bought.length?bought.map(m=>`<span class="chip" data-act="toMade" data-k="${m}">${mats[m].name}</span>`).join('')
      :'<div class="mini">사 오는 품목이 없습니다.</div>'}`,
  f:`<div class="btn pri" data-go="waste">다음</div>`};};

V.cost=()=>{
  const m='basque',it=mats[m],sell=priceOf('basque'),lab=Math.round(S.wage*it.mins/60);
  return {l:'← 구운 것|bake', c:'원가', r:it.name,
    b:`<div style="text-align:center;padding:8px 0 18px"><div class="mini">한 ${it.u} 원가</div>
        <div><span class="num xl">${fullCost(m).toLocaleString()}</span><span class="sub" style="font-size:15px">원</span></div>
        <div class="mini">${원(sell)}에 팔면 <b class="pos">${원(sell-fullCost(m))}</b> 남습니다</div></div>
      <div class="mini" style="margin-bottom:4px">한 판에 들어가는 것</div>
      ${Object.keys(it.batch).map(x=>{const sk=skus[mainSku(x)];
        return `<div class="step"><span class="l">${mats[x].name} ${it.batch[x]}${mats[x].u}
          <div class="mini">${sk.name} ${원(sk.buy)} ÷ ${fmt(x,sk.size)}</div></span>
          <span class="v">${원(unitPrice(x)*it.batch[x])}</span></div>`;}).join('')}
      <div class="step" style="border-top:1px solid var(--line);border-bottom:0"><span class="l"><b>한 판 재료값</b></span><span class="v">${원(batchCost(m))}</span></div>
      <div class="step" style="border-bottom:0"><span class="l">만드는 시간 ${it.mins}분 × 시급 ${S.wage.toLocaleString()}원
        <div class="mini">견주어 보라고 넣은 참고값</div></span><span class="v">${원(lab)}</span></div>
      <div class="step" style="border-top:1px solid var(--line);border-bottom:0"><span class="l"><b>한 판</b></span><span class="v"><b>${원(batchCost(m)+lab)}</b></span></div>
      <div class="step" style="border-bottom:0"><span class="l">${josa(it.yield+it.u,'이/가')} 나오니까</span><span class="v">÷ ${it.yield}</span></div>
      <div class="step" style="border-top:1px solid var(--line);border-bottom:0"><span class="l"><b>한 ${it.u}</b></span><span class="v"><b>${원(fullCost(m))}</b></span></div>
      <div class="card soft" style="margin-top:14px"><div class="mini" style="margin-bottom:6px">사 오는 것과 견주면</div>
        <div class="kv"><span>직접 구움</span><b>${원(fullCost(m))}</b></div>
        <div class="kv"><span>사 옴 (A베이커리)</span><b>2,600원</b></div>
        <div class="kv"><span>차이</span><b class="${fullCost(m)<2600?'pos':'neg'}">${fullCost(m)<2600?'−':'+'}${원(Math.abs(fullCost(m)-2600))}</b></div></div>
      <div class="mini" style="margin-top:10px">만드는 시간은 하루 인건비에 이미 들어 있습니다. 손익에서 또 빼지 않습니다.</div>`,
    f:`<div class="btn" data-go="bake">돌아가기</div>`};

V.waste=()=>{
  const rows=[];
  for(const m of madeMats()){
    const cur=S.todayWaste[m]||0;
    rows.push(`<div class="row"><span class="nm">${mats[m].name}
      <div class="mini">${원(costOf(m))} / ${mats[m].u} · 직접 만듦</div></span>
      <span class="stp"><span class="pill" data-act="w-" data-k="${m}">−</span><b>${cur}</b>
        <span class="pill" data-act="w+" data-k="${m}">+</span></span></div>`);
  }
  for(const s in skus){
    const sk=skus[s], cur=S.todayWaste[s]||0;
    if(sk.size===1){
      rows.push(`<div class="row"><span class="nm">${sk.name}
        <div class="mini">${원(sk.buy)} / ${sk.cu}</div></span>
        <span class="stp"><span class="pill" data-act="w-" data-k="${s}">−</span><b>${cur}</b>
          <span class="pill" data-act="w+" data-k="${s}">+</span></span></div>`);
    } else {
      const lab=v=>sk.showBase
        ? (v===0?'없음':`${Math.round(v*sk.size)}${mats[sk.mat].u}`)
        : fracLabel(v,sk.cu);
      rows.push(`<div class="row" style="display:block">
        <div style="display:flex;align-items:center"><span class="nm">${sk.name}
          <div class="mini">${원(sk.buy)} / ${sk.showBase?fmt(sk.mat,sk.size):sk.cu}</div></span>
          <b>${cur?lab(cur)+' · '+원(cur*sk.buy):''}</b></div>
        <div style="margin-top:8px">${[0,0.25,0.5,1].map(v=>
          `<span class="chip ${cur===v?'on':''}" data-act="wu" data-k="${s}" data-v="${v}">${lab(v)}</span>`).join('')}</div></div>`);
    }
  }
  return {l:'← 구운 것|bake', c:'버린 것 적기', r:'3 / 3',
    b:`<div class="sub" style="margin-bottom:12px">오늘 버린 것만 적어 주세요. 없으면 그냥 넘기시면 됩니다.</div>
      ${rows.join('')}
      <div class="card soft" style="margin-top:14px"><div class="kv"><span>오늘 버린 금액</span><b class="neg">${원(wasteMoney())}</b></div></div>
      <div class="note">여는 통은 <b>반 통·1/4로 대충 고르면 됩니다.</b> ml를 재지 않습니다.</div>`,
    f:`<div class="btn pri" data-act="toRecv">다 했어요</div>`};
};

V.recv=()=>{
  const sug=history[HIST[6]].suggested||{};
  const rows=Object.keys(sug).map(s=>{const sk=skus[s], v=S.todayRecv[s]??sug[s];
    return `<div class="row"><span class="nm">${sk.name}<div class="mini">어제 시킨 수량 ${sug[s]}${sk.cu}</div></span>
      ${S.recvEdit?`<span class="stp"><span class="pill" data-act="r-" data-k="${s}">−</span><b>${v}</b><span class="pill" data-act="r+" data-k="${s}">+</span></span>`
                  :`<b>${v}${sk.cu}</b>`}</div>`;}).join('');
  return {l:'← 폐기|waste', c:'받은 물건 확인', r:'',
    b:`<div class="t1">어제 시킨 게 왔나요?</div>
      <div class="sub" style="margin:6px 0 16px">${[...new Set(Object.keys(sug).map(s=>skus[s].sup))].join(' · ')}에 어제 주문한 수량입니다.</div>
      <div class="card">${rows}</div>
      <div class="note ok">이 확인 한 번이면 <b>재고를 세지 않아도</b> 앱이 지금 몇 통인지 압니다.</div>`,
    f:S.recvEdit?`<div class="btn pri" data-act="recvOk">이대로 저장</div>`
      :`<div class="btn" data-act="recvDiff">다르게 왔어요</div><div class="btn pri" data-act="recvOk">그대로 왔어요</div>`};
};

V.order=()=>{
  if(!isDeliveryDay()) return V.orderNone_();
  const all=orderList();
  const sups=[...new Set(all.map(o=>skus[o.sku].sup))];
  const orders=S.supFilter?all.filter(o=>skus[o.sku].sup===S.supFilter):all;
  const bakes=S.supFilter?[]:madeMats().map(m=>({m,b:bakeSuggest(m)})).filter(x=>x.b.batches>0);
  const bakeCards=bakes.map(({m,b})=>{const it=mats[m];
    const short=Object.keys(b.mats).filter(x=>stockNow(x)<b.mats[x]);
    return `<div class="card dash"><span class="badge acc">내일 구울 것</span>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:9px">
        <div><b style="font-size:14px">${it.name}</b><div class="mini" style="margin-top:3px">1판 = ${it.yield}${it.u} · ${it.mins}분</div></div>
        <div><span class="num">${b.batches}</span><span class="mini">판</span></div></div>
      <div class="sub" style="margin-top:10px;padding-top:10px;border-top:1px dashed #ddd">
        7일 평균 ${fmt(m,b.need)} 예상 · 지금 ${fmt(m,b.stock)} 남음 → ${b.yieldQty}${it.u} = <b>${b.batches}판</b></div>
      <div class="kv" style="margin-top:8px"><span>필요한 재료</span><span style="text-align:right">${Object.keys(b.mats).map(x=>`${mats[x].name} ${fmt(x,b.mats[x])}`).join(' · ')}</span></div>
      ${short.length?`<div class="note" style="margin:9px 0 0"><b>${josa(short.map(x=>mats[x].name).join('·'),'이/가')} 모자랍니다.</b><br>아래 발주에 넣었습니다.</div>`:''}</div>`;}).join('');
  const cardOf=o=>{const sk=skus[o.sku], q=S.order[o.m]??o.qty;
    return `<div class="card tap" data-go="detail" data-k="${o.m}">
      <div style="display:flex;justify-content:space-between;align-items:flex-end">
        <div><b style="font-size:13px">${sk.name}</b>
          <div class="mini" style="margin-top:2px">${sk.showBase?`${fmt(o.m,sk.size)}씩`:(sk.unit>1?`${sk.unit}${sk.cu}들이 ${sk.box}`:`${sk.cu} 단위`)}</div></div>
        <div><span class="num">${sk.showBase?Math.round(q*sk.size):q}</span><span class="mini">${sk.showBase?mats[o.m].u:sk.cu}</span></div></div>
      <div class="sub" style="margin-top:10px;padding-top:10px;border-top:1px dashed #ddd">
        7일 평균 ${fmt(o.m,o.sug.base)} · ${o.sug.cover.length}일치 · 지금 ${fmt(o.m,o.sug.stock)} 남음 → <b>${qtyText(o.sku,q)}</b>
        ${o.note?`<div class="mini" style="margin-top:3px">${o.note}</div>`:''}
        ${S.orderTouched[o.m]?`<div class="mini" style="margin-top:3px">직접 ${josa(q+sk.cu,'으로/로')} 고치셨습니다</div>`:''}</div></div>`;};
  // 거래처별로 묶어 보여준다 — 사장은 거래처 단위로 전화한다
  const bySup={}; orders.forEach(o=>{const s=skus[o.sku].sup;(bySup[s]=bySup[s]||[]).push(o);});
  const groups=Object.keys(bySup).map(sup=>`
    <div class="gh" style="display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px">
      <span><b style="font-size:13px">${sup}</b> <span class="mini">· 마감 ${SUP[sup].deadline} · ${bySup[sup].length}건</span></span>
      <span class="chip" style="margin:0" data-act="copy" data-v="${sup}">이 거래처만 복사</span></div>
    ${bySup[sup].map(cardOf).join('')}`).join('<div class="hr"></div>');

  return {l:S.supFilter?'← 전부|order':'', c:S.supFilter||'오늘 할 일', r:md(TODAY),
    b:`<div style="margin-bottom:10px">
        <span class="chip ${!S.supFilter?'on':''}" data-act="supAll">전부</span>
        ${sups.map(s=>`<span class="chip ${S.supFilter===s?'on':''}" data-act="supFilter" data-v="${s}">${s}</span>`).join('')}</div>
      ${bakes.length?`<div class="mini" style="margin-bottom:7px">주방</div>${bakeCards}<div class="hr"></div>`:''}
      ${groups||'<div class="card">오늘 시킬 품목이 없습니다.</div>'}
      <div class="mini" style="text-align:center;margin-top:6px">카드를 누르면 계산 과정과 다른 크기를 볼 수 있습니다</div>`,
    f:`<div class="btn" data-act="copy" data-v="${S.supFilter||''}">${S.supFilter?'이 거래처 복사':'전부 복사'}</div>
       <div class="btn pri" data-act="confirm">${orders.length+bakes.length}건 확정</div>`};
};
V.orderNone_=()=>{const P=pl();
  return {l:'', c:'오늘 요약', r:md(TODAY),
    b:`<div class="card dash"><div class="t2">오늘은 발주하는 날이 아닙니다</div></div><div class="hr"></div>
      <div class="card"><div class="kv"><span>판 것</span><b>${원(P.rev)}</b></div>
        <div class="kv"><span>남은 돈</span><b class="pos">${원(P.net)}</b></div></div>`,

  const alts=skusOf(m);
  return {l:'← 목록|order', c:mats[m].name, r:sk.sup,
    b:`${alts.length>1?`<div style="margin-bottom:12px"><div class="mini" style="margin-bottom:6px">어느 크기로 시킬까요</div>
        ${alts.map(a=>`<span class="chip ${a===skuFor(m)?'on':''}" data-act="sku" data-k="${m}" data-v="${a}">${skus[a].name}</span>`).join('')}
        <div class="mini" style="margin-top:4px">${skus[mainSku(m)].name} 기준 ${fmt(m,1)}당 ${Math.round(unitPrice(m)*100)/100}원</div></div>`:''}

V.done=()=>{
  const orders=orderList(), bySup={};
  orders.forEach(o=>{const s=skus[o.sku].sup;(bySup[s]=bySup[s]||[]).push(o);});
  const bakes=madeMats().map(m=>({m,b:bakeSuggest(m)})).filter(x=>x.b.batches>0);
  const expiring=Object.keys(mats).filter(m=>mats[m].shelf<=1&&stockNow(m)>0);
  const useUp=m=>{const left=stockNow(m),cands=[];
    for(const mk in menus){const r=recipeOf(mk); if(!r||!r[m])continue; cands.push({mk,n:Math.floor(left/r[m])});}
    cands.sort((a,b)=>b.n-a.n);
    const top=cands.filter(c=>c.n>0).slice(0,2);
    if(!top.length) return '내일까지 못 쓰면 버리게 됩니다. 직원 시식으로 돌리거나 서비스로 내보세요.';
    return `${top.map(c=>`${menus[c.mk].name} ${c.n}개`).join(' 또는 ')} 분량입니다.<br>내일 하루 메뉴로 올리거나 세트로 묶어 내보세요.`;};
  return {l:'', c:'확정 완료', r:md(TODAY),
    b:`<div class="t1" style="margin-bottom:14px">오늘 할 일이 정해졌습니다</div>
      ${bakes.length?`<div class="card soft"><div class="t2" style="font-size:13px;margin-bottom:8px">주방</div>
        ${bakes.map(({m,b})=>`<div class="kv"><span>${mats[m].name}</span><b>내일 ${b.batches}판 (${b.yieldQty}${mats[m].u})</b></div>`).join('')}</div>`:''}
      ${Object.keys(bySup).map(sup=>`<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
          <span class="t2" style="font-size:13px">${sup} <span class="mini">· 마감 ${SUP[sup].deadline}</span></span>
          <span class="chip" style="margin:0" data-act="copy" data-v="${sup}">복사</span></div>
        ${bySup[sup].map(o=>{const q=S.order[o.m]??o.qty,sk=skus[o.sku];
          return `<div class="kv"><span>${sk.name}</span><b>${qtyText(o.sku,q)}${sk.unit>1?` (${(q/sk.unit).toFixed(0)}${sk.box})`:''}</b></div>`;}).join('')}
        <div class="btn sm" style="margin-top:10px" data-act="copy" data-v="${sup}">${sup} 내역 복사해서 보내기</div></div>`).join('')}
      <div class="note"><b>실제 발주는 직접 해주세요.</b><br><span class="sub">복사한 내역을 전화나 메신저로 거래처에 보내시면 됩니다.</span></div>
      ${expiring.length?`<div class="hr"></div><div class="card dash"><span class="badge att">내일까지 쓰면 좋아요</span>
        ${expiring.map(m=>`<div class="t2" style="margin:9px 0 5px">${mats[m].name} ${fmt(m,stockNow(m))} · ${원(stockNow(m)*costOf(m))}</div>
          <div class="sub">${useUp(m)}</div>`).join('')}
        <div class="mini" style="margin-top:9px;padding-top:8px;border-top:1px solid #eee">재료 상태는 직접 확인해 주세요.</div></div>`:''}`,
    f:`<div class="btn" data-act="copy">발주 내역 복사</div><div class="btn pri" data-go="home">홈으로</div>`};
};

/* 재고 맞추기 — 재료별로 묶고, 사는 단위마다 통 수를 정수로 센다 */
V.count=()=>{
  let dq=0, dm=0;
  const groups=Object.keys(mats).map(m=>{
    const calc=stockNow(m);
    const keys=isMade(m)?[null]:skusOf(m);
    // 손대지 않은 재료는 앱 계산이 맞는 것으로 본다 (여는 통 때문에 생기는 가짜 차이를 막는다)
    const touched=keys.some(s=>S.count[s||m]!=null);
    let counted=0;
    const rows=keys.map(s=>{
      const key=s||m, sk=s?skus[s]:{name:mats[m].name, cu:mats[m].u, size:1};
      // 딴 통에 남은 건 안 센다 → 내림. 320g은 500g 한 팩이 아니다
      const dflt=s?(s===mainSku(m)?Math.max(0,Math.floor(calc/sk.size)):0):Math.max(0,Math.floor(calc));
      const v=S.count[key]??dflt;
      counted+=v*sk.size;
      const showBase=s&&skus[s].showBase;
      return `<div class="row" style="padding:8px 2px"><span class="nm">${sk.name}
          ${showBase?`<div class="mini">${fmt(m,sk.size)}짜리</div>`:''}</span>
        <span class="stp"><span class="pill sm" data-act="c-" data-k="${key}">−</span>
          <b style="min-width:44px">${showBase?Math.round(v*sk.size):v}</b>
          <span class="pill sm" data-act="c+" data-k="${key}">+</span>
          <span class="mini" style="width:26px">${showBase?mats[m].u:sk.cu}</span></span></div>`;
    }).join('');
    const diff=touched?counted-calc:0;
    if(Math.abs(diff)>0.001){dq++; dm+=diff*costOf(m);}
    return `<div class="grp"><div class="gh">
        <span><b style="font-size:13px">${mats[m].name}</b>
          <div class="mini">앱 계산 ${fmt(m,calc)}</div></span>
        <span style="text-align:right">${touched?`<b>${fmt(m,counted)}</b>`:'<b class="mini">그대로</b>'}
          ${Math.abs(diff)>0.001?`<div class="mini" style="color:var(--att)">${diff>0?'+':''}${fmt(m,Math.abs(diff))} 차이</div>`:'<div class="mini">맞음</div>'}</span>
      </div>${rows}</div>`;
  }).join('');
  return {l:'← 홈|home', c:'재고 맞추기', r:'주 1회',
    b:`<div class="note ok"><b>통을 세서 넣어 주세요.</b> 앱이 계산한 값이 미리 채워져 있으니
        <b>다른 것만</b> 고치시면 됩니다. 여는 통은 세지 않아도 됩니다.</div>
      ${groups}
      <div class="card soft"><div class="kv"><span>차이 나는 재료</span><b>${dq}종</b></div>
        <div class="kv"><span>차이 금액</span><b class="${dm<0?'neg':''}">${dm?원(dm):'0원'}</b></div></div>
      <div class="mini" style="margin-top:10px">시식·서비스로 나간 양입니다. 매주 크게 차이 나면 레시피를 다시 확인해 보세요.</div>`,
    f:`<div class="btn pri" data-act="saveCount">맞습니다</div>`};
};

/* ══════════════ 설명 ══════════════ */
const EX={
  home:['홈','매일 여기서 시작합니다. 할 일은 <b>사진 올리기와 버린 것 적기</b> 둘뿐입니다.'],
  upload:['매출 찍기','모든 줄의 수량을 고칠 수 있습니다. 흐릿한 줄은 확인하면 표시가 사라집니다.'],
  recipe:['새 메뉴 묻기','매일 흐름에서 <b>모르는 메뉴가 있을 때만</b> 나옵니다. 다 알면 목록으로 넘어갑니다.'],
  menuList:['메뉴와 재료','등록된 메뉴 전체. 메뉴를 누르면 판매가와 재료를 고칠 수 있습니다.'],
  menuEdit:['메뉴 고치기','판매가와 재료 수량을 ± 로 고칩니다. 재료를 빼거나 새로 넣을 수도 있습니다. 고치면 <b>소모량·재고·발주·수익률이 전부 다시 계산</b>됩니다.'],
  itemList:['품목','무엇을 사 오고 무엇을 굽는지. <b>크로플을 직접 만듦으로 바꾸면 오늘 구운 것에 나타납니다.</b>'],
  itemEdit:['품목 고치기','들여오는 방법(사 옴·직접 만듦·원부자재), 사는 크기와 값, 굽는 것이면 한 판 재료와 나오는 개수를 정합니다.'],
  bake:['오늘 구운 것','판 수만 적으면 크림치즈·계란이 얼마나 나갔는지 계산합니다.'],
  cost:['원가','재료값 합계 ÷ 나오는 조각. 만드는 시간을 시급으로 환산해 사 오는 것과 견줍니다.'],
  waste:['버린 것 적기','<b>사는 단위로</b> 적습니다. 우유 1L와 2.3L를 따로 셉니다. 여는 통은 반 통·1/4로 고릅니다.'],
  recv:['받은 물건 확인','확정 수량이 기본값입니다. 다르게 왔으면 고칠 수 있습니다.'],
  order:['오늘 할 일','7일 기록에서 실제로 계산합니다. 구울 양이 재료 발주에 반영됩니다.'],
  detail:['추천 상세','<b>어느 크기로 시킬지 고를 수 있습니다.</b> 우유를 2.3L로 바꾸면 통 수가 다시 계산됩니다.'],
  done:['확정 완료','거래처별로 묶습니다. 발주 내역 복사를 누르면 메신저에 붙여 넣을 텍스트가 복사됩니다.'],
  res:['결과 확인','수익 탭을 눌러 보세요. 버린 것이나 매출을 바꾸면 같이 움직입니다.'],
  menupl:['메뉴별 뜯어보기','한 개 팔릴 때 실제로 얼마 남는지.'],
  fixed:['매장 설정','모든 값을 ± 로 고칩니다. 아래 수익률이 바로 따라옵니다.'],
  count:['재고 맞추기','<b>재료별로 묶고 사는 단위마다 통 수를 셉니다.</b> 정수로만 올라갑니다. 우유 1L 3통 + 2.3L 1통 = 5.3L.'],
};

/* ══════════════ 렌더 ══════════════ */
const NAV=[['ghd','매일'],['home','홈'],['upload','매출 찍기'],['bake','오늘 구운 것'],
  ['waste','버린 것 적기'],['recv','받은 물건 확인'],
  ['ghd','발주하는 날'],['order','오늘 할 일'],['detail','추천 상세'],['done','확정 완료'],
  ['ghd','보는 화면'],['res','결과 확인 · 수익률'],['menupl','메뉴별 뜯어보기'],['cost','원가'],
  ['ghd','등록해 둔 것'],['itemList','품목'],['menuList','메뉴와 재료'],['fixed','매장 설정'],['count','재고 맞추기']];
let tt=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400);}
function render(){
  const v=V[S.screen]();
  const hL=document.getElementById('hL');
  hL.textContent=v.l?v.l.split('|')[0]:''; hL.dataset.go=v.l?v.l.split('|')[1]:'';
  document.getElementById('hC').textContent=v.c;
  const hR=document.getElementById('hR');hR.textContent=v.r||'';hR.style.display=v.r?'':'none';
  document.getElementById('bd').innerHTML=v.b;
  const ft=document.getElementById('ft');ft.innerHTML=v.f||'';ft.style.display=v.f?'':'none';
  document.getElementById('bd').scrollTop=0;
  document.getElementById('nav').innerHTML=NAV.map(([k,l])=>
    k==='ghd'?`<div class="ghd">${l}</div>`:`<a data-go="${k}" class="${S.screen===k?'on':''}">${l}</a>`).join('');
  const e=EX[S.screen]||['',''];
  document.getElementById('expl').innerHTML=`<b>${e[0]}</b>${e[1]}`;
}

/* ══════════════ 조작 ══════════════ */
const bump=(o,k,d,min=0)=>{o[k]=Math.max(min,(o[k]||0)+d);};
document.getElementById('reset').addEventListener('click',()=>{
  S=blank(); menus=cloneMenus(); resetItems(); render(); toast('오늘 입력과 고친 설정을 초기화했습니다');});

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-go],[data-act]'); if(!t) return;
  const act=t.dataset.act, go=t.dataset.go, k=t.dataset.k, v=t.dataset.v;
  const ocrDone=x=>{S.ocrCheck=S.ocrCheck.filter(y=>y!==x);};

  if(act==='up') S.uploaded=true;
  if(act==='reshoot'){S.uploaded=false;S.ocrCheck=['clatte'];}
  if(act==='s+'){bump(S.todaySales,k,1);ocrDone(k);}
  if(act==='s-'){bump(S.todaySales,k,-1);ocrDone(k);}
  if(act==='ocrOk') ocrDone(k);

  if(act==='price') S.newPrice=+v;
  if(act==='chip'){ if(S.newRecipe[k]) delete S.newRecipe[k]; else S.newRecipe[k]=+v; }
  if(act==='saveRecipe'){
    if(S.newPrice) menus.skrofl.price=S.newPrice;
    if(Object.keys(S.newRecipe).length) menus.skrofl.recipe={...S.newRecipe};
    toast(josa(menus.skrofl.name,'을/를')+' 저장했습니다'); S.screen='bake';
  }
  if(act==='b+') bump(S.todayBaked,k,1);
  if(act==='b-') bump(S.todayBaked,k,-1);
  if(act==='w+') bump(S.todayWaste,k,1);
  if(act==='w-') bump(S.todayWaste,k,-1);
  if(act==='wu') S.todayWaste[k]=+v;

  if(act==='toRecv') S.screen=Object.keys(history[HIST[6]].suggested||{}).length?'recv':'order';
  if(act==='recvDiff'){S.recvEdit=true;
    const sug=history[HIST[6]].suggested; for(const s in sug) if(S.todayRecv[s]==null) S.todayRecv[s]=sug[s];}
  if(act==='r+'){const sug=history[HIST[6]].suggested; S.todayRecv[k]=(S.todayRecv[k]??sug[k])+1;}
  if(act==='r-'){const sug=history[HIST[6]].suggested; S.todayRecv[k]=Math.max(0,(S.todayRecv[k]??sug[k])-1);}
  if(act==='recvOk'){const sug=history[HIST[6]].suggested;
    for(const s in sug) if(S.todayRecv[s]==null) S.todayRecv[s]=sug[s];
    S.recvEdit=false; S.screen='order'; toast('입고를 저장했습니다. 재고가 다시 계산됐습니다');}

  // 메뉴 고치기 — 판매가·재료. skrofl 은 임시값을 정식 데이터로 옮긴 뒤 고친다
  const editing=()=>{
    const key=S.editMenu;
    if(key==='skrofl'){
      if(S.newPrice){ menus.skrofl.price=S.newPrice; S.newPrice=0; }
      if(Object.keys(S.newRecipe).length){ menus.skrofl.recipe={...S.newRecipe}; S.newRecipe={}; }
    }
    if(!menus[key].recipe) menus[key].recipe={};
    return menus[key];
  };
  if(act==='mp+'){ const m=editing(); m.price=(m.price||0)+500; }
  if(act==='mp-'){ const m=editing(); m.price=Math.max(0,(m.price||0)-500); }
  if(act==='ma+'||act==='ma-'){
    const m=editing(), st=(mats[k].u==='ml'||mats[k].u==='g')?10:1;
    m.recipe[k]=Math.max(0,(m.recipe[k]||0)+(act==='ma+'?st:-st));
    if(m.recipe[k]===0) delete m.recipe[k];
  }
  if(act==='mdel'){ const m=editing(); delete m.recipe[k]; }
  if(act==='madd'){ const m=editing(); m.recipe[k]=(mats[k].u==='ml'||mats[k].u==='g')?50:1; }

  // 품목 고치기
  const IT=()=>mats[S.editItem||'krofl'];
  if(act==='toMade'){ const it=mats[k]; it.kind='직접 만듦';
    it.batch=it.batch||{}; it.yield=it.yield||8; it.mins=it.mins||60;
    S.editItem=k; S.screen='itemEdit';
    toast(`${mats[k].name} — 한 판에 뭐가 들어가는지 알려주세요`); }
  if(act==='ikind'){ const it=mats[k]; it.kind=v;
    if(v==='직접 만듦'){ it.batch=it.batch||{}; it.yield=it.yield||8; it.mins=it.mins||60; }
    toast(`${mats[k].name} → ${v}`); }
  if(act==='ib+'||act==='ib-'){ const it=IT(); it.batch=it.batch||{};
    const st=(mats[k].u==='ml'||mats[k].u==='g')?50:1;
    it.batch[k]=Math.max(0,(it.batch[k]||0)+(act==='ib+'?st:-st));
    if(!it.batch[k]) delete it.batch[k]; }
  if(act==='ibdel'){ const it=IT(); delete it.batch[k]; }
  if(act==='ibadd'){ const it=IT(); it.batch=it.batch||{};
    it.batch[k]=(mats[k].u==='ml'||mats[k].u==='g')?100:1; }
  if(act==='iy+') { const it=IT(); it.yield=(it.yield||0)+1; }
  if(act==='iy-') { const it=IT(); it.yield=Math.max(1,(it.yield||1)-1); }
  if(act==='im+') { const it=IT(); it.mins=(it.mins||0)+5; }
  if(act==='im-') { const it=IT(); it.mins=Math.max(0,(it.mins||0)-5); }
  if(act==='isz+'){ const sk=skus[k]; sk.size+=(mats[sk.mat].u==='개'?1:100); }
  if(act==='isz-'){ const sk=skus[k]; sk.size=Math.max(1,sk.size-(mats[sk.mat].u==='개'?1:100)); }
  if(act==='ipr+'){ skus[k].buy+=100; }
  if(act==='ipr-'){ skus[k].buy=Math.max(0,skus[k].buy-100); }
  if(act==='imain'){ const m=skus[k].mat; skusOf(m).forEach(s=>skus[s].main=(s===k)); delete S.orderSku[m]; }

  if(act==='sku'){ S.orderSku[k]=v; delete S.order[k]; delete S.orderTouched[k]; }
  if(act==='o+'||act==='o-'||act==='oset'){
    const m=S.detail, base=orderSuggest(m).qty;
    let cur=S.order[m]??base;
    if(act==='o+')cur+=1; else if(act==='o-')cur=Math.max(0,cur-1); else cur=+v;
    S.order[m]=cur; S.orderTouched[m]=cur!==base;
  }
  if(act==='confirm'){S.confirmed=true;S.screen='done';toast('확정했습니다. 실제 발주는 거래처에 직접 해주세요');}
  if(act==='copy'){
    const only=v||null;                       // 거래처 하나만 복사할 수 있다
    const orders=orderList().filter(o=>!only||skus[o.sku].sup===only);
    const bySup={}; orders.forEach(o=>{const s=skus[o.sku].sup;(bySup[s]=bySup[s]||[]).push(o);});
    let txt='';
    if(only){
      txt=`${only} 사장님, ${md(TODAY)} 발주드립니다.\n\n`;
      (bySup[only]||[]).forEach(o=>{const q=S.order[o.m]??o.qty,sk=skus[o.sku];
        txt+=`${sk.name} ${qtyText(o.sku,q)}${sk.unit>1?` (${(q/sk.unit).toFixed(0)}${sk.box})`:''}\n`;});
      txt+=`\n감사합니다.`;
    } else {
      txt=`[${md(TODAY)} 발주]\n`;
      for(const sup in bySup){ txt+=`\n${sup} (마감 ${SUP[sup].deadline})\n`;
        bySup[sup].forEach(o=>{const q=S.order[o.m]??o.qty,sk=skus[o.sku];
          txt+=`- ${sk.name} ${qtyText(o.sku,q)}${sk.unit>1?` (${(q/sk.unit).toFixed(0)}${sk.box})`:''}\n`;});}
    }
    const n=orders.length;
    const done=()=>toast(only?`${only} 발주 ${n}건을 복사했습니다. 메신저에 붙여 넣으세요`
                              :`발주 ${n}건을 복사했습니다. 메신저에 붙여 넣으세요`);
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(done);
    else {const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
          try{document.execCommand('copy');}catch(e){} ta.remove(); done();}
  }
  if(act==='supFilter') S.supFilter=v;
  if(act==='supAll') S.supFilter=null;
  if(act==='tab') S.resTab=v;
  if(act==='plm') S.plMenu=v;
  if(act==='owner') S.ownerPay=(v==='1');
  if(act==='tax') S.taxType=v;
  if(act==='card') S.cardRatio=+v;
  if(act==='fx+') S.fixed[k]+=10000;
  if(act==='fx-') S.fixed[k]=Math.max(0,S.fixed[k]-10000);
  if(act==='od+') S.openDays=Math.min(31,S.openDays+1);
  if(act==='od-') S.openDays=Math.max(1,S.openDays-1);
  if(act==='wg+') S.wage+=500;
  if(act==='wg-') S.wage=Math.max(0,S.wage-500);
  if(act==='sh+') S.staffHours=Math.min(24,S.staffHours+1);
  if(act==='sh-') S.staffHours=Math.max(0,S.staffHours-1);
  if(act==='oh+') S.ownerHours=Math.min(24,S.ownerHours+1);
  if(act==='oh-') S.ownerHours=Math.max(0,S.ownerHours-1);

  if(act==='c+'||act==='c-'){                       // 재고 실사 — 정수로만
    const made=!!mats[k];
    const size=made?1:skus[k].size, m=made?k:skus[k].mat;
    const calc=stockNow(m);
    const dflt=made?Math.max(0,Math.floor(calc)):(k===mainSku(m)?Math.max(0,Math.floor(calc/size)):0);
    const cur=S.count[k]??dflt;
    S.count[k]=Math.max(0, cur+(act==='c+'?1:-1));
  }
  if(act==='saveCount'){
    let n=0, money=0;
    for(const m in mats){
      const calc=stockNow(m);
      let counted=0, touched=false;
      const keys=isMade(m)?[m]:skusOf(m);
      keys.forEach(key=>{
        const size=isMade(m)?1:skus[key].size;
        const dflt=isMade(m)?Math.max(0,Math.floor(calc)):(key===mainSku(m)?Math.max(0,Math.floor(calc/size)):0);
        if(S.count[key]!=null) touched=true;
        counted+=(S.count[key]??dflt)*size;
      });
      if(!touched) continue;
      const d=counted-calc;
      if(Math.abs(d)>0.001){ S.stockAdj[m]=(S.stockAdj[m]||0)+d; money+=d*costOf(m); n++; }
    }
    S.count={}; S.screen='home';
    toast(n?`${n}종을 맞췄습니다 (${money>0?'+':''}${Math.round(money).toLocaleString()}원). 추천에 바로 반영됩니다`:'재고가 맞습니다');
  }
  if(go){ if(k){ if(go==='menuEdit') S.editMenu=k;
                 else if(go==='itemEdit') S.editItem=k;
                 else S.detail=k; } S.screen=go; }
  render();
});
render();
</script>
</body>
</html>
